server {
    listen 80;
    server_name azeezridwan.tech www.azeezridwan.tech;

    # Fichiers statiques servis directement par Nginx
    location /static/ {
        alias /var/www/AREB1/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Fichiers médias (images de projets, miniatures)
    location /media/ {
        alias /var/www/AREB1/media_cdn/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy vers Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
    }

    client_max_body_size 250M;
}
