{% for project in projects %}
  {% include 'components/project_card.html' %}
{% empty %}
<div class="col-span-full rounded-2xl border border-dashed border-white/10 bg-surface-container-low/50 px-8 py-20 text-center">
  {% if active_category == 'video' %}
  <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center mx-auto mb-4 text-white">
    <span class="material-symbols-outlined text-[24px]">movie</span>
  </div>
  <h3 class="font-headline font-bold text-xl text-white">{{ t.projects.coming_soon_title }}</h3>
  <p class="mx-auto mt-2 max-w-md font-sans text-sm leading-relaxed text-on-surface-variant">
    {{ t.projects.coming_soon_desc }}
  </p>
  {% else %}
  <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center mx-auto mb-4 text-white">
    <span class="material-symbols-outlined text-[24px]">folder_open</span>
  </div>
  <p class="font-sans text-sm text-on-surface-variant">{{ t.projects.empty_cat }}</p>
  {% endif %}
</div>
{% endfor %}
