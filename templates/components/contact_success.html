<div id="contact-form" class="flex min-h-[380px] flex-col items-center justify-center text-center p-6" role="status" aria-live="polite">
  <div class="w-16 h-16 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-white mb-6">
    <span class="material-symbols-outlined text-[32px]">check</span>
  </div>
  <h3 class="font-headline font-extrabold text-2xl text-white uppercase">{{ t.contact.success_title }}</h3>
  <p class="mt-3 max-w-md font-sans text-sm leading-relaxed text-on-surface-variant">
    {{ t.contact.success_subtitle }}
  </p>
  <p class="mt-6 font-mono text-xs text-white/50">
    <span class="text-emerald-400">✓</span> 200 OK · Transmitted
  </p>
</div>
