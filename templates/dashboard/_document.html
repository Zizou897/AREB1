{% load static %}<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Studio — Azeez Ridwan{% endblock %}</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            surface: 'var(--surface)',
            'surface-container-lowest': 'var(--surface-container-lowest)',
            'surface-container-low': 'var(--surface-container-low)',
            'surface-container': 'var(--surface-container)',
            'surface-container-high': 'var(--surface-container-high)',
            'on-surface': 'var(--on-surface)',
            'on-surface-variant': 'var(--on-surface-variant)',
            line: 'var(--line)',
            cyan: 'var(--cyan)',
            violet: 'var(--violet)',
            ink: 'var(--ink)',
            'ink-body': 'var(--ink-body)',
            'ink-mute': 'var(--ink-mute)',
          },
          fontFamily: {
            display: ['"Geist"', 'sans-serif'],
            headline: ['"Geist"', 'sans-serif'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  <style>
    .bg-surface-2 { background-color: var(--surface-container-low); }
    .border-line { border-color: var(--line); }
    .text-ink { color: var(--on-surface); }
    .text-ink-mute { color: var(--on-surface-variant); }
  </style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen">
  {% block body %}{% endblock %}
</body>
</html>
