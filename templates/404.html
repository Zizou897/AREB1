{% extends 'base.html' %}

{% block title %}Page introuvable — Azeez{% endblock %}

{% block content %}
<section class="flex min-h-[80vh] flex-col items-center justify-center px-5 pt-20 text-center">
  <p class="font-mono text-sm text-ink-mute"><span class="text-rose-400">error:</span> page introuvable</p>
  <h1 class="mt-4 font-display text-[clamp(4rem,14vw,7rem)] font-bold leading-none tracking-tight">
    <span class="grad-word">404</span>
  </h1>
  <p class="mt-4 max-w-md leading-[1.65]">
    Cette page n'existe pas ou a été déplacée.
    Le reste du site, lui, fonctionne parfaitement — c'est promis.
  </p>
  <a href="{% url 'core:home' %}" class="btn-primary mt-9 inline-flex min-h-[48px] items-center gap-2 rounded-xl px-7 py-3.5 text-[0.9375rem]">
    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6 6-6-6 6-6"/></svg>
    Retour à l'accueil
  </a>
</section>
{% endblock %}
